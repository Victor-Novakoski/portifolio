    <!-- A ficha do caçador "se imprime" uma vez por sessão (só translate, o texto já nasce legível). -->
    <script>
      ;(function () {
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return
          if (sessionStorage.getItem('forja-print') === '1') return
          sessionStorage.setItem('forja-print', '1')
          document.documentElement.classList.add('printing')
        } catch (e) {}
      })()
    </script>
